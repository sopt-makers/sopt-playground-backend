<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playground Admin - Login</title>
    <link rel="icon" type="image/x-icon" href="https://playground.sopt.org/favicon.ico">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@sun-typeface/suit@2.0.5/fonts/variable/woff2/SUIT-Variable.css">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <link rel="stylesheet" th:href="@{/css/admin-login.css}">
</head>
<body>
    <main class="mds-login">
        <section class="mds-card mds-login-card">
            <div class="mds-login-header">
                <h1 class="mds-heading2">Playground Admin</h1>
                <p class="mds-text-subtle">관리자 키를 입력하세요</p>
            </div>

            <form id="loginForm" class="mds-stack" onsubmit="return handleLogin(event)">
                <div id="errorMessage" class="mds-callout mds-callout-danger" role="alert" hidden>
                    <span class="mds-callout-icon">
                        <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
                            <circle cx="10" cy="10" r="8.25" stroke="currentColor" stroke-width="1.5"/>
                            <path d="M10 5.75v5.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                            <circle cx="10" cy="14" r="1" fill="currentColor"/>
                        </svg>
                    </span>
                    <p id="errorMessageText" class="mds-callout-body"></p>
                </div>

                <div class="mds-field">
                    <label class="mds-field-label" for="adminKey">Admin Key</label>
                    <input class="mds-input" type="password" id="adminKey" required placeholder="관리자 키를 입력하세요" autofocus>
                </div>

                <button type="submit" class="mds-btn mds-btn-md mds-btn-primary mds-login-submit">로그인</button>
            </form>
        </section>
    </main>

    <script>
        // 로그인 후 돌아갈 페이지. 오픈 리다이렉트를 막기 위해 /admin/ 아래 경로만 허용한다
        const redirectParam = new URLSearchParams(window.location.search).get('redirect');
        const nextPage = redirectParam && redirectParam.startsWith('/admin/') ? redirectParam : '/admin/popups';

        // 이미 로그인된 경우 리다이렉트
        if (localStorage.getItem('adminKey')) {
            window.location.href = nextPage;
        }

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            document.getElementById('errorMessageText').textContent = message;
            errorDiv.hidden = false;
            setTimeout(() => {
                errorDiv.hidden = true;
            }, 3000);
        }

        function handleLogin(event) {
            event.preventDefault();

            const adminKey = document.getElementById('adminKey').value;

            // Admin Key 검증 API 호출
            fetch('/api/v1/popups/validate-admin-key', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'admin-key': adminKey
                }
            })
            .then(response => {
                if (response.ok) {
                    // 로컬 스토리지에 저장
                    localStorage.setItem('adminKey', adminKey);
                    // 요청한 페이지(기본: 팝업 관리)로 이동
                    window.location.href = nextPage;
                } else if (response.status === 403) {
                    showError('잘못된 관리자 키입니다.');
                } else {
                    showError('오류가 발생했습니다. 다시 시도해주세요.');
                }
            })
            .catch(error => {
                showError('네트워크 오류가 발생했습니다.');
                console.error('Login error:', error);
            });

            return false;
        }
    </script>
</body>
</html>
